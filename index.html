function addDish(id){let p=places.find(x=>x.id===id);if(!p)return;modal('补充 '+p.name+' 的菜单','<form id="dishform"><div class="modalgrid"><div class="full"><label>菜品名称</label><input class="text" id="dishname" required placeholder="你吃过的菜"></div><div><label>菜品价格（¥）</label><input class="text" id="dishprice" type="number" min="0" placeholder="可不填"></div><div><label>人均价格（¥）</label><input class="text" id="venueprice" type="number" min="0" placeholder="可不填"></div><div><label>蛋白质（g）</label><input class="text" id="dishprotein" type="number" min="0" placeholder="估算，可不填"></div><div><label>膳食纤维（g）</label><input class="text" id="dishfiber" type="number" min="0" placeholder="估算，可不填"></div><div><label>碳水（g）</label><input class="text" id="dishcarbs" type="number" min="0" placeholder="估算，可不填"></div><div><label>热量（kcal）</label><input class="text" id="dishkcal" type="number" min="0" placeholder="估算，可不填"></div></div><p class="hint">只填你知道的内容；营养数值可留空。先保存在本机；登录云同步后会同步到你的其他设备。</p><div class="modalactions"><button type="button" class="small" data-close>取消</button><button type="submit" class="primary">保存菜品</button></div></form>');$('#dishform').onsubmit=e=>{e.preventDefault();let val=id=>$('#'+id).value===''?null:Number($('#'+id).value),d={name:$('#dishname').value.trim(),price:val('dishprice'),protein:val('dishprotein'),fiber:val('dishfiber'),carbs:val('dishcarbs'),kcal:val('dishkcal'),emoji:'🍽️'};p.dishes=p.dishes||[];p.dishes.push(d);let vp=val('venueprice');if(vp!=null)p.price=vp;state.edits[p.id]={price:p.price,dishes:p.dishes};save();render();closeModal();toast('已保存到这家店的个人菜单')}}

function logMeal(){let p=places.find(x=>x.id===state.plan);if(!p){toast('先选一家店加入计划');return}modal('记录这顿饭','<form id="logform"><div class="field"><div class="label">'+esc(p.name)+' · 今天吃得怎么样？</div><div class="segment" id="rate"><button type="button" class="sel" data-rate="5">很喜欢</button><button type="button" data-rate="4">不错</button><button type="button" data-rate="3">一般</button><button type="button" data-rate="2">不太行</button></div></div><div class="modalgrid"><div><label>实际人均花费（¥）</label><input class="text" id="cost" type="number" min="0" placeholder="如 42"></div><div><label>实际往返耗时（分钟）</label><input class="text" id="actualtime" type="number" min="0" placeholder="如 '+(p.out*2)+'"></div><div class="full"><label>备注</label><textarea class="text" id="note" placeholder="菜量、口味、下次还想点什么…"></textarea></div></div><div class="modalactions"><button type="button" class="small" data-close>取消</button><button type="submit" class="primary">保存记录</button></div></form>');let rate=5;$$('#rate button').forEach(b=>b.onclick=()=>{$$('#rate button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');rate=Number(b.dataset.rate)});$('#logform').onsubmit=e=>{e.preventDefault();state.history.unshift({placeId:p.id,date:new Date().toISOString(),rating:rate,cost:Number($('#cost').value)||null,time:Number($('#actualtime').value)||null,note:$('#note').value});state.plan=null;save();render();closeModal();toast('已保存，之后可以在用餐记录查看')}}
function addPlace(){modal('添加一家店','<form id="addform"><div class="modalgrid"><div class="full"><label>店铺名称</label><input class="text" id="newname" required placeholder="例如：公司附近的家常菜"></div><div><label>菜系</label><select class="select" id="newcuisine"><option>家常菜</option><option>面食</option><option>轻食</option><option>烧烤</option></select></div><div><label>人均价格（¥）</label><input class="text" id="newprice" type="number" min="1" value="40" required></div><div><label>单程时间（分钟）</label><input class="text" id="newroute" type="number" min="1" value="15" required></div><div><label>推荐菜</label><input class="text" id="newdish" value="招牌套餐"></div><div><label>蛋白质估算（g）</label><input class="text" id="newprotein" type="number" min="0" value="28"></div><div><label>膳食纤维估算（g）</label><input class="text" id="newfiber" type="number" min="0" value="6"></div><div class="full"><label>位置或备注</label><input class="text" id="newarea" placeholder="街道、商场或自己的备注"></div></div><p class="hint">先保存在本机；登录云同步后会同步到你的其他设备。</p><div class="modalactions"><button type="button" class="small" data-close>取消</button><button type="submit" class="primary">保存店铺</button></div></form>');$('#addform').onsubmit=e=>{e.preventDefault();let id='u'+Date.now(),price=Number($('#newprice').value),out=Number($('#newroute').value),p={id:id,name:$('#newname').value.trim(),cuisine:$('#newcuisine').value,area:$('#newarea').value.trim()||'我的收藏',price:price,rating:0,distance:out*.1,out:out,eat:35,stroll:0,party:[1,2,3,4],meals:['lunch','dinner'],tags:['个人添加'],pos:'p5',emoji:'🍲',dishes:[{name:$('#newdish').value||'招牌套餐',price:price,protein:Number($('#newprotein').value),fiber:Number($('#newfiber').value),carbs:60,kcal:560,emoji:'🍱'}]};state.custom.push(p);places.push(p);save();render();closeModal();toast('店铺已加入你的清单')}}
$('#meal').onclick=e=>{let b=e.target.closest('[data-v]');if(b){state.meal=b.dataset.v;render()}};
$('#people').onclick=e=>{let b=e.target.closest('[data-v]');if(b){state.people=Number(b.dataset.v);render()}};
$('#pref').onclick=e=>{let b=e.target.closest('[data-v]');if(b){state.preference=b.dataset.v;render()}};
$('#cuisine').onclick=e=>{let b=e.target.closest('[data-v]');if(b){state.cuisine=b.dataset.v;render()}};
$('#time').oninput=e=>{state.time=Number(e.target.value);$('#timeval').textContent=state.time+'分钟'};
$('#time').onchange=render;$('#budget').oninput=e=>{state.budget=Number(e.target.value);$('#budgetval').textContent='¥'+state.budget};$('#budget').onchange=render;
$('#origin').onchange=e=>{state.origin=e.target.value;render()};$('#sort').onchange=e=>{state.sort=e.target.value;render()};
$('#recommend').onclick=()=>{state.view='places';state.sort='recommended';render();toast('已按今天的条件重新排序')};
$('#reset').onclick=()=>{state=Object.assign({},base,{favorites:state.favorites,history:state.history,custom:state.custom,edits:state.edits,plan:state.plan});render()};
$('#add').onclick=addPlace;$('#log').onclick=logMeal;$('#close').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target===$('#backdrop'))closeModal()};
document.body.addEventListener('click',e=>{let b=e.target.closest('[data-amap-config]');if(b){configureAmap();return}b=e.target.closest('[data-amap-search]');if(b){searchAmapNearby();return}b=e.target.closest('[data-live-marker]');if(b){showAmapPoi(Number(b.dataset.liveMarker));return}b=e.target.closest('[data-live-route]');if(b){calculateAmapRoute(Number(b.dataset.liveRoute));return}b=e.target.closest('[data-fav]');if(b){let id=b.dataset.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):state.favorites.concat([id]);render();toast(state.favorites.includes(id)?'已收藏':'已取消收藏');return}b=e.target.closest('[data-detail]');if(b){detail(b.dataset.detail);return}b=e.target.closest('[data-edit]');if(b){addDish(b.dataset.edit);return}b=e.target.closest('[data-choose]');if(b){choose(b.dataset.choose);return}b=e.target.closest('[data-close]');if(b){closeModal();return}b=e.target.closest('[data-view]');if(b){state.view=b.dataset.view;render();return}b=e.target.closest('[data-nav]');if(b){let n=b.dataset.nav;state.view=n==='saved'?'saved':n==='history'?'history':'places';$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===n));render();if(innerWidth<680)document.querySelector('.results').scrollIntoView({behavior:'smooth'});return}});
$('#filterhead').onclick=e=>{if(innerWidth<680&&!e.target.closest('#reset'))$('#filters').classList.toggle('collapsed')};
render();
</script><script src="./cloud-sync.js"></script></body></html>
